name: clip
# Нарезка смешных моментов из видео, которое владелец прислал боту. Запускает admin.py.
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "file_id видео в Telegram"
        required: true
      count:
        description: "Сколько моментов вырезать"
        default: "3"
      chat:
        description: "Кому прислать нарезки"
        required: true

permissions:
  contents: write

concurrency:
  group: clip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Нарезать
        run: python3 -u clipbot.py "${{ inputs.file_id }}" "${{ inputs.count }}" "${{ inputs.chat }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Сохранить список нарезок
        run: |
          git config user.name "channel-bot"
          git config user.email "channel-bot@users.noreply.github.com"
          git add clip_batch.json
          git diff --cached --quiet && exit 0
          git commit -m "Новые нарезки для выбора"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
